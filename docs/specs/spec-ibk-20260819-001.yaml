id: spec-ibk-20260819-001
version: "1.0"
status: draft
type: bq_pipeline
empresa: ibk
equipo: data-platform
fecha: "2026-08-19"
autor: lsullon
aprobador: lmorales

# ------------------------------------------------------------
# 1. CONTEXTO
# ------------------------------------------------------------
contexto:
  nombre: "Centralización de Consentimientos LPDP Interbank (IBK)"
  tipo_flujo: etl
  descripcion: >
    Centraliza diariamente los eventos de consentimiento/rechazo de tratamiento de datos
    personales (LPDP) de clientes Interbank: lee el archivo GCS vía tabla externa temporal,
    resuelve el identificador unificado ITC contra iden_itc_party y carga t_consent_transaction
    (delete+insert por itc_company_id + consent_date). Deriva de allí ba_customer_consent_group
    con los consentimientos CP_2 otorgados vigentes.
  objetivo_negocio: Registra cuando un individuo otorgando o revoca un consentimiento para un propósito específico.   # completar: impacto en cumplimiento normativo LPDP / auditoría
  data_owner: lmorales         # completar: línea LPDP / Consentimiento Interbank
  business_steward: lmorales
  kpis: []

# ------------------------------------------------------------
# 2. ETAPAS APLICABLES
# ------------------------------------------------------------
etapas:
  plan: true
  design: true
  coding: true
  orchestration: true
  integridad: false   # DESACTIVADO (2026-08-26, pedido por el usuario, RN-IBK-018) — el gate y su registro en metadata_operational se quitaron del Workflow, ver RN-IBK-018
  monitoring: true
  data_quality: false    # DESACTIVADO (2026-08-26, pedido por el usuario, RN-IBK-018) — los 2 SP de DQ y la validación post-loop se quitaron del Workflow, ver RN-IBK-018. SPs y dq_config/dq_control quedan en el repo, sin invocarse
  dataops: true
  compliance: true
  testing: true       # activar solo después de correr InfraOps + Dataops en dev
  infraops: true
  security: true
  documentation: true

# ------------------------------------------------------------
# 3. FUENTES DE DATOS
# ------------------------------------------------------------
fuentes:
  - id: consentimiento_ibk_archivo
    descripcion: >
      Archivo diario .txt.gz de eventos de consentimiento LPDP de clientes IBK en GCS,
      leído vía tabla externa temporal (TTL 2 días). DDL de referencia: input/ddl_table_external.txt
    proyecto: dev-intercorp-data-storage
    dataset: raw_ibk_dlk          # confirmado por el equipo — reemplaza al dataset personal "lsullon" del DDL de referencia original
    tabla: "t_consent_transaction_{fecha_archivo}_external"   # confirmado: 1 tabla externa NUEVA por fecha, no una tabla estática reemplazada
    volumetria: 6822318            # confirmado con archivo real de dev (2026-08-21) — la estimación original (60000) era ~100x menor
    particion: "consent_date"                # tabla externa, sin partición BQ
    pii: true
    tipo_fuente: archivo
    campo_fecha: "{YYYYMMDD} en ruta GCS gs://p-ibkbi-rdp-stg-dlk-us-suoh/data/m_consent/current/{YYYYMMDD}/{UUID}/"
    rol: principal               # universo del proceso — activado con etapas.integridad: true (2026-08-19)
    llave: [party_id, consent_date_time]   # cambiado 2026-08-21: consent_transaction_id viene SIEMPRE vacío en el archivo real (confirmado con Interbank), no es utilizable como llave

    # ── Campos agregados por DISCOVERY (2026-08-19) ────────────────
    tabla_canonica: "dev-intercorp-data-storage.raw_ibk_dlk.t_consent_transaction_{fecha_archivo}_external"
    tabla_profiling: no_aplica
    glosario_status: no_aplica   # fuente tipo archivo — no hay tabla BQ que perfilar todavía
    glosario_path: ~
    campos_join_clave: [party_id, consent_date_time]   # ver nota en "llave" — actualizado 2026-08-21
    empresas_cubiertas: ["000", "1000"]   # filtro de negocio declarado en RN-IBK-003/006 — confirmado: ambos códigos pertenecen a Interbank (ver RN-IBK-003)
    observaciones: >
      Sin acceso BigQuery desde esta sesión al proyecto dev-intercorp-data-storage
      (mcp.tools.call denegado) — no se pudo confirmar en vivo la creación de la tabla externa.
      Confirmado por el equipo (2026-08-19): la tabla externa se crea como
      `{proyecto}.{dataset}.t_consent_transaction_{fecha_archivo}_external` — una tabla NUEVA
      por cada fecha procesada (no una tabla estática reemplazada con CREATE OR REPLACE).
      En un reproceso histórico (rango de fechas) coexisten varias de estas tablas temporales
      simultáneamente, una por cada `fecha_archivo` del rango — el SP/Workflow debe limpiarlas
      (TTL 2 días o DROP explícito) para no acumular objetos huérfanos en `raw_ibk_dlk`.

  - id: iden_party
    descripcion: >
      Identidad unificada de persona a nivel Grupo Intercorp — resuelve el campo `id`
      cruzando por party_id, filtrado a itc_company_id IN ('000','1000')
    proyecto: dev-intercorp-data-operation   # corregido: "dev-intercorp-data_operation" con guión bajo es un Project ID inválido — confirmado por error de la API de BigQuery ("Invalid project ID")
    dataset: matillion_dev
    tabla: iden_itc_party_prd
    volumetria: 40000000
    particion: ~
    pii: true
    tipo_fuente: tabla
    rol: secundaria
    llave: [party_id, itc_company_id]
    campo_fecha: process_date   # según glosario de referencia: "usar MAX(process_date) para el estado actual"

    # ── Campos agregados por DISCOVERY (2026-08-19) ────────────────
    tabla_canonica: "dev-intercorp-data-operation.matillion_dev.iden_itc_party_prd"   # sin verificar — sin acceso BQ desde esta sesión
    tabla_profiling: sin_acceso
    glosario_status: sin_acceso   # no existe glosario de "iden_itc_party_prd" en data/data_catalog/; se usó como referencia un glosario de una tabla relacionada (ver observaciones)
    glosario_path: "data/data_catalog/master_party/iden-itc-party.md"   # tabla de REFERENCIA, no la misma físicamente — ver observaciones
    particion: "Sin partición (según tabla de referencia) — filtrar siempre por process_date/itc_company_id"
    volumetria: "~467.7M filas en la tabla de referencia intercorp-data-storage-pv.master_party.iden_itc_party (2026-03-10) — NO confirmado para iden_itc_party_prd"
    campos_join_clave: [party_id, id, itc_company_id]
    empresas_cubiertas: ["000 (Interbank, ~5.4M filas — confirmado en c_itc_company)", "1000 (~26.9M filas — confirmado por Data Owner: segundo itc_company_id registrado también para Interbank)"]
    observaciones: >
      Intento de acceso vía BigQuery MCP a dev-intercorp-data-operation.matillion_dev.iden_itc_party_prd
      denegado (mcp.tools.call). El proyecto dev-intercorp-data_operation (guión bajo, tal como
      venía en el requerimiento original) fue RECHAZADO por la API de BigQuery como Project ID
      inválido — confirma que el valor correcto debe llevar guión, no guión bajo.
      No existe glosario propio de "iden_itc_party_prd" en data/data_catalog/. Se usó como
      referencia el glosario de intercorp-data-storage-pv.master_party.iden_itc_party (467.7M filas,
      22 empresas, sin partición, campos id/party_id/itc_company_id/process_date/load_date/party_type_id).
      Confirmado por el equipo (2026-08-19):
      (1) '000' y '1000' son ambos itc_company_id de Interbank — la empresa está registrada con
      2 códigos en el modelo, por eso el filtro siempre incluye los dos juntos (no son entidades
      distintas ni un código "holding" separado, como se especulaba antes de confirmar).
      (2) iden_itc_party_prd tiene la misma estructura que la tabla de referencia iden_itc_party
      (id, party_id, itc_company_id, process_date, load_date, party_type_id) — confirmado por el
      equipo, aunque sigue sin poder verificarse en vivo desde esta sesión (sin acceso BQ).
      Pendiente aún: confirmar si también carece de partición (impacto en costo de la SP, dado que
      la tabla de referencia tiene 467.7M filas y full-scan sin filtro es costoso).

# ------------------------------------------------------------
# 3b. REGLAS DE INTEGRIDAD (etapas.integridad: true, activado 2026-08-19)
# ------------------------------------------------------------
