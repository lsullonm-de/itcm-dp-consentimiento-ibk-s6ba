monitoring:
  METADATA_API_URL: "${METADATA_API_URL}"   # referencia a env_dev.json/env_prd.json — no hardcodear la URL aquí
  process:
    code: ${env}-t-consent-transaction-ibk   # debe coincidir con el nombre real del workflow en GCP
    zone_code: master
    company_id: "000"
    company_code: "IBK"
    business_name: "Centralización de Consentimientos LPDP Interbank"
    flag_active: "1"
    flag_scheduler: "1"   # el módulo tiene Cloud Scheduler (cs-ibk-consentimiento.yaml)
  tasks:
    - code: sp_t_consent_transaction_ibk
      object_name: t_consent_transaction
      object_source: ["dev-intercorp-data-storage.raw_ibk_dlk.t_consent_transaction_{fecha_archivo}_external", "dev-intercorp-data-operation.matillion_dev.iden_itc_party_prd"]
      description: "Centraliza consentimientos LPDP de Interbank en t_consent_transaction"
    - code: sp_ba_customer_consent_group_ibk
      object_name: ba_customer_consent_group
      object_source: ["dev-intercorp-data-storage.master_party.t_consent_transaction"]
      description: "Deriva consentimientos CP_2 otorgados en ba_customer_consent_group"