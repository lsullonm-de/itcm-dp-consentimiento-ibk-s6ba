  reglas:
    - id: RI-IBK-T_CONSENT_TRANSACTION-001
      fuente_id: consentimiento_ibk_archivo
      tipo_check: actualidad
      accion: detener_proceso

    - id: RI-IBK-T_CONSENT_TRANSACTION-002
      fuente_id: consentimiento_ibk_archivo
      tipo_check: duplicados
      accion: excluir_registros

    - id: RI-IBK-T_CONSENT_TRANSACTION-003
      fuente_id: consentimiento_ibk_archivo
      tipo_check: llave_nula
      accion: excluir_registros

    - id: RI-IBK-T_CONSENT_TRANSACTION-004
      fuente_id: iden_party
      tipo_check: duplicados
      accion: excluir_registros

    - id: RI-IBK-T_CONSENT_TRANSACTION-005
      fuente_id: iden_party
      tipo_check: llave_nula
      accion: excluir_registros

# ------------------------------------------------------------
# 4. OUTPUTS
# ------------------------------------------------------------
outputs:
  - tabla: t_consent_transaction
    proyecto: dev-intercorp-data-storage
    dataset: master_party
    descripcion: >
      Centraliza cada evento de consentimiento/rechazo LPDP de clientes IBK con el id
      unificado ITC resuelto vía iden_itc_party. DDL: input/ddl_output_t_consent_transaction.txt
    capa: master
    particion: consent_date
    tipo_carga: incremental    # delete+insert por itc_company_id + consent_date — ver RN-IBK-004/005
    campos_auditoria: [load_date, record_source, creation_user]
    pii: true

  - tabla: ba_customer_consent_group
    proyecto: dev-intercorp-data-storage
    dataset: master_party
    descripcion: >
      Consentimientos CP_2 otorgados vigentes por cliente IBK, derivado exclusivamente
      de t_consent_transaction. DDL: input/ddl_output_ba_customer_consent_group.txt
    capa: business
    particion: consent_date
    tipo_carga: incremental    # delete+insert por itc_company_id + consent_date
    campos_auditoria: [load_date, record_source, creation_user]
    pii: true

# ------------------------------------------------------------
# 5. REGLAS DE NEGOCIO
# ------------------------------------------------------------
reglas_negocio:
  - id: RN-IBK-001
    descripcion: >
      Se crea una tabla externa NUEVA por cada fecha procesada — `{proyecto}.{dataset}.
      t_consent_transaction_{fecha_archivo}_external` — apuntando a la ruta GCS de esa fecha.
      No es una tabla estática reemplazada con CREATE OR REPLACE: en un reproceso histórico
      (rango de fechas) coexisten varias de estas tablas temporales al mismo tiempo, una por
      cada fecha del rango. Vigencia máxima 2 días (TTL o limpieza explícita del Workflow).
    criticidad: media   # regla de arquitectura/infraestructura, no verificable con una regla DQ sobre datos
    campo_afectado: "tabla externa t_consent_transaction_{fecha_archivo}_external"
    validado_por: lsullon
    referencia: "input/ddl_table_external.txt"

  - id: RN-IBK-002
    descripcion: >
      El {YYYYMMDD} de la ruta GCS y del nombre de la tabla externa se calcula como
      process_date - 1 día SOLO en modo normal (fecha de sistema) — actualizado 2026-08-26,
      ver RN-IBK-014: en manual/reproceso la fecha indicada por el usuario es la carpeta exacta,
      sin restarle un día.
    criticidad: media   # regla de cálculo de parámetros de ejecución, no verificable con una regla DQ sobre datos
    campo_afectado: "ruta GCS / nombre tabla externa"
    validado_por: lsullon

  - id: RN-IBK-003
    descripcion: >
      SUPERADA por RN-IBK-019 (2026-08-26) — el cruce ahora es por party_id ÚNICAMENTE, sin
      igualar también itc_company_id. Se deja este texto por historial:
      Antes de insertar en t_consent_transaction, cruzar por party_id contra
      dev-intercorp-data-operation.matillion_dev.iden_itc_party_prd, filtrando
      itc_company_id IN ('000','1000'), para obtener el id unificado ITC.
    criticidad: alta
    campo_afectado: id
    validado_por: lsullon

  - id: RN-IBK-004
    descripcion: >
      El consent_date usado en t_consent_transaction es el valor real contenido en cada
      registro del archivo — no se deriva por offset fijo, ya que el desfase entre folder_date
      y el consent_date de contenido no es constante (ejemplo observado: ~2 días respecto a la
      fecha de sistema). Desde RN-IBK-019 (2026-08-26) ya NO es llave de borrado (ver RN-IBK-005).
    criticidad: alta
    campo_afectado: consent_date
    validado_por: lsullon

  - id: RN-IBK-005
    descripcion: >
      RESTAURADA por RN-IBK-020 (2026-08-27, rollback de RN-IBK-019) y luego CORREGIDA por
      RN-IBK-021 (mismo día) — el DELETE ya NO es por (itc_company_id, consent_date), es por
      (itc_company_id, record_source) — ver RN-IBK-021, causaba pérdida de datos real entre
      archivos que comparten el mismo MAX(consent_date). Texto original (ya no vigente en el
      detalle, se deja por historial):
      Carga a t_consent_transaction es DELETE + INSERT: se eliminan los registros de
      itc_company_id + consent_date(s) presentes en el batch antes de insertar los nuevos.
    criticidad: alta
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-011
    descripcion: >
      SUPERADA por RN-IBK-020 (2026-08-27, rollback pedido por el usuario) — t_consent_transaction
      vuelve a guardar el HISTORIAL COMPLETO por cliente; la dedup "último evento" se movió a
      ba_customer_consent_group_ibk.sql (ver esa SP). Se deja este texto por historial:
      t_consent_transaction guarda solo el ÚLTIMO evento (otorgado o rechazado) por cliente
      (id) — no el historial completo de eventos del archivo (cambio de diseño 2026-08-26,
      confirmado con el usuario; el contrato original la describía como historial completo
      de cada evento). Implementado con QUALIFY ROW_NUMBER() OVER (PARTITION BY id ORDER BY
      consent_date DESC) = 1 en sp_t_consent_transaction_ibk.sql, sobre TODOS los eventos
      resueltos contra iden_itc_party_prd (sin filtrar por consent_type antes de rankear).
      Como consecuencia, ba_customer_consent_group_ibk.sql ya NO necesita su propio dedup por
      cliente (RN-IBK-006 actualizada) — solo filtra CP_2/otorgado sobre una fuente que ya
      viene deduplicada. Se usa consent_date (precisión de día, sin hora) como criterio de
      orden; el usuario decidió explícitamente NO agregar consent_date_time como columna
      nueva en t_consent_transaction solo para desempatar — en empate exacto de fecha el
      desempate es no determinista.
    criticidad: alta
    campo_afectado: t_consent_transaction, ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-012
    descripcion: >
      RESTAURADA por RN-IBK-020 (2026-08-27, rollback de RN-IBK-019) — este filtro por
      MAX(consent_date) vuelve a ser el vigente:
      Los DATOS se filtran por consent_date antes de insertar — no se inserta el archivo
      completo sin filtrar (bug real 2026-08-19 a 2026-08-26: antes de este fix, cada reproceso
      traía basura histórica, incluido consent_date de 1900, valor centinela de sistemas legacy
      de Interbank). Historia de 2 iteraciones:
      1ª iteración (fallida): filtrar contra p_process_date_ini/p_process_date_end (calculados a
      partir de folder_date = process_date - 1). Falló con datos reales — el desfase entre
      folder_date y el consent_date de contenido resultó variable ENTRE ARCHIVOS (confirmado:
      -1 día en un archivo, 0 en otros dos de la misma semana) — no existe ninguna fecha
      calculada externamente que sea confiable.
      2ª iteración (vigente, pedida por el usuario): se calcula v_max_consent_date =
      SAFE_CAST(MAX(consent_date) AS DATE) directamente del archivo (tabla externa), ANTES del
      cruce con iden_party, y se filtra consent_date = v_max_consent_date. Se adapta
      automáticamente al desfase real de cada archivo (sea cual sea) y excluye la basura
      histórica sin necesitar ningún parámetro externo, porque un valor centinela como 1900
      nunca va a ser el máximo real de un archivo con actividad genuina. Se aplica antes del
      QUALIFY de RN-IBK-011. p_process_date_ini/end ya NO participan en el filtro de datos — solo
      se usan para folder_date (RN-IBK-002) y el sufijo de tablas temporales (RN-IBK-013).
    criticidad: alta
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-013
    descripcion: >
      Las tablas temporales de este módulo llevan un sufijo de fecha (YYYYMMDD) en su nombre —
      fix 2026-08-26, para que dos ejecuciones concurrentes (ej. el Cloud Scheduler disparando el
      modo normal mientras corre un reproceso manual) no se pisen la misma tabla física.
      Con RN-IBK-020 (2026-08-27, rollback de RN-IBK-019): sp_t_consent_transaction_ibk.sql
      vuelve a usar su tabla de scope tmp_t_consent_transaction_ibk_{fecha} (que ella misma
      elimina al terminar). sp_ba_customer_consent_group_ibk.sql sigue sin usar ninguna tabla de
      scope (hace DELETE por empresa + INSERT directo, RN-IBK-017/019).
    criticidad: media
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-014
    descripcion: >
      El offset de -1 día (folder_date = process_date - 1, RN-IBK-002) aplica SOLO en modo
      normal (fecha de sistema, RN-IBK-009) — pedido por el usuario (2026-08-26) tras confusión
      recurrente sobre qué carpeta lee cada fecha en manual/reproceso. Antes el offset se aplicaba
      siempre, dentro de los SPs (sp_t_consent_transaction_ibk.sql, sp_integridad_t_consent_transaction.sql).
      Ahora: el Workflow aplica el offset SOLO al calcular la fecha en modo_normal (step
      modo_normal, DATE_SUB(CURRENT_DATE(...), INTERVAL 1 DAY)); en manual/reproceso la fecha que
      indica el usuario se usa TAL CUAL como nombre de carpeta. Ambos SPs ahora reciben
      p_process_date_ini ya como el folder_date definitivo — ninguno resta un día internamente.
    criticidad: alta
    campo_afectado: "ruta GCS / nombre tabla externa"
    validado_por: lsullon

  - id: RN-IBK-015
    descripcion: >
      RESTAURADA por RN-IBK-020 (2026-08-27, rollback de RN-IBK-019) — vuelve a existir
      p_carga_historica en sp_t_consent_transaction_ibk.sql y el chequeo previo en el Workflow.
      Texto vigente:
      Carga histórica en reproceso (pedido por el usuario, 2026-08-26): si t_consent_transaction
      no tiene ninguna fila con itc_company_id IN ('000','1000') al iniciar un reproceso, el
      PRIMER archivo del rango (process_date_init) se carga SIN el filtro de consent_date de
      RN-IBK-012 — trae TODO el historial real del archivo, no solo el último evento por fecha.
      El resto de fechas del mismo rango (process_date_init+1 en adelante) sigue el
      comportamiento normal (RN-IBK-012). Implementado con un nuevo parámetro
      p_carga_historica BOOL en sp_t_consent_transaction_ibk.sql; el Workflow decide su valor
      con un chequeo previo (SELECT COUNT(1) ... WHERE itc_company_id IN ('000','1000')) — solo
      se ejecuta en modo reproceso, nunca en normal/manual. RN-IBK-011 (último evento por
      cliente) sigue aplicando incluso durante la carga histórica — la diferencia es que compite
      entre TODOS los eventos del archivo, no solo entre los del día MAX(consent_date).
    criticidad: alta
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-016
    descripcion: >
      record_source en t_consent_transaction = 'LPDP_IBK_' || {nombre del archivo de carga}
      (pedido por el usuario, 2026-08-26) — antes era el literal fijo 'LPDP_IBK'. El nombre del
      archivo se obtiene del pseudo-campo _FILE_NAME de BigQuery (propio de external tables sobre
      GCS, no cubierto por SELECT *, hay que seleccionarlo explícito), recortado a solo el nombre
      del archivo sin la ruta (REGEXP_EXTRACT(_FILE_NAME, r'[^/]+$')). Ejemplo:
      LPDP_IBK_T_IN_LPDP_CONSENTIMIENTO_20260813.txt.gz. Solo aplica a t_consent_transaction —
      ba_customer_consent_group mantiene su propio literal 'LPDP_IBK' sin cambios (no se pidió).
    criticidad: media
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-018
    descripcion: >
      Se retiran del Workflow los pasos de integridad y calidad de datos (pedido por el usuario,
      2026-08-26): "que se enfoque en procesar e insertar, o bueno, registrar en el API". Se
      eliminan de wf-ibk-consentimiento.yaml: el gate de integridad por fecha (build_sql_integridad_*,
      ejecutar_validacion_integridad, registrar_resultado_integridad vía RegisterIntegrityResults),
      las 2 llamadas a SP de DQ por fecha/corrida (sp_dq_t_consent_transaction,
      sp_dq_ba_customer_consent_group) y la validación post-loop de reglas DQ críticas
      (build_sql_validar_dq/validar_dq_criticas, con su resumen en el mail de éxito). El
      subworkflow RegisterIntegrityResults y el subworkflow genérico SyncBigQueryJob (sin
      resultados) quedaron sin uso y también se eliminaron del Workflow.
      Los SP de integridad/DQ (sp_integridad_t_consent_transaction.sql,
      sp_dq_t_consent_transaction.sql, sp_dq_ba_customer_consent_group.sql) y las tablas
      dq_config/dq_control NO se borraron del repositorio — solo dejaron de invocarse.
      DETECCIÓN DE ARCHIVO FALTANTE (RN-IBK-010) SE MANTIENE, pero cambia de mecanismo: antes
      dependía del SP de integridad (evaluaba actualidad ANTES de llamar a sp_t_consent_transaction_ibk);
      ahora se reutiliza el RAISE que ya lanzaba sp_t_consent_transaction_ibk.sql cuando la tabla
      externa tiene 0 filas (ver su punto 4) — el Workflow envuelve la llamada al SP en un
      try/except, reconoce ese mensaje puntual ("no se ejecuta DELETE sin INSERT de reemplazo")
      y omite la fecha sin abortar el resto del rango; cualquier otro error se relanza igual que
      antes (checkpoint + mail de error).
    criticidad: media
    campo_afectado: workflow
    validado_por: lsullon

  - id: RN-IBK-019
    descripcion: >
      PARCIALMENTE REVERTIDA por RN-IBK-020 (2026-08-27, rollback pedido por el usuario, ver esa
      entrada) — de los 4 cambios de abajo, se REVIRTIERON el (1) y el (2): ya no existe
      t_consent_transaction_raw ni sp_centralizar_t_consent_transaction_ibk.sql,
      sp_t_consent_transaction_ibk.sql vuelve a escribir directo en t_consent_transaction por
      cada fecha del rango. Los cambios (3) (cruce solo por party_id) y (4) (DELETE por empresa)
      SÍ SIGUEN VIGENTES, no se revirtieron. Se deja el texto original completo por historial:
      REDISEÑO COMPLETO de la carga hacia t_consent_transaction (pedido por el usuario,
      2026-08-26) — 4 cambios juntos:
      (1) NUEVA TABLA t_consent_transaction_raw: cada archivo procesado (cada fecha del rango)
      se vuelca TAL CUAL, sin cruzar con iden_party ni colapsar por cliente ("cada evento tal
      cual"), a t_consent_transaction_raw — trazabilidad completa por archivo. Idempotente por
      folder_date (DELETE+INSERT si se reprocesa la misma fecha); fechas DISTINTAS se acumulan
      todas, nunca se trunca. sp_t_consent_transaction_ibk.sql pasó a hacer SOLO esto (perdió los
      parámetros de iden_party y p_carga_historica).
      (2) SOLO SE CENTRALIZA EL ÚLTIMO ARCHIVO: si se manda un rango, todas las fechas se cargan
      a raw, pero únicamente el archivo de la ÚLTIMA fecha que sí tuvo archivo (no siempre
      process_date_fin, ver RN-IBK-010) se centraliza hacia t_consent_transaction y
      ba_customer_consent_group — el resto del rango queda solo en raw. Nueva SP
      sp_centralizar_t_consent_transaction_ibk.sql, llamada UNA vez por ejecución del Workflow
      (no por fecha), después de iterar_fechas.
      (3) CRUCE CON iden_party SOLO POR party_id (ya NO también por itc_company_id, reemplaza
      RN-IBK-003): confirmado con datos reales de dev (2026-08-26) que el archivo de Interbank
      siempre trae itc_company_id='000', pero una misma persona puede tener en iden_itc_party_prd
      un registro bajo '000' Y otro bajo '1000' (ambos códigos son Interbank) — exigir que
      coincidiera el itc_company_id del archivo excluía ~2.78M de esas filas (de 6.76M matches
      por party_id, solo ~3.98M sobrevivían el filtro por empresa). Pedido explícito del usuario:
      "no excluir nada" — cada coincidencia de iden_party genera su propia fila en
      t_consent_transaction, con el itc_company_id/id de ESE registro (no el del archivo). El
      filtro de MAX(consent_date) (RN-IBK-012) y la carga histórica (RN-IBK-015) quedan
      obsoletos: ya no hace falta acotar por fecha porque solo se centraliza UN archivo por
      corrida (nunca compiten dos archivos por la misma consent_date, la causa real de un bug de
      pérdida de datos encontrado el mismo día: dos folder_dates consecutivos con el mismo
      MAX(consent_date) real, el segundo pisaba lo insertado por el primero).
      (4) DELETE POR EMPRESA, no por fecha ni TRUNCATE: t_consent_transaction ahora hace
      DELETE WHERE itc_company_id IN ('000','1000') antes de insertar el archivo centralizado
      completo (reemplaza el DELETE por itc_company_id+consent_date de RN-IBK-005).
      ba_customer_consent_group_ibk.sql también cambia de TRUNCATE (RN-IBK-017) a este mismo
      DELETE por empresa — un TRUNCATE borraría filas de otras empresas que la tabla pudiera
      tener.
    criticidad: alta
    campo_afectado: t_consent_transaction, ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-020
    descripcion: >
      ROLLBACK parcial de RN-IBK-019 (pedido por el usuario, 2026-08-27) — 3 cambios juntos:
      (1) Se elimina la tabla t_consent_transaction_raw y la SP
      sp_centralizar_t_consent_transaction_ibk.sql (vivieron menos de un día). SP1
      (sp_t_consent_transaction_ibk.sql) vuelve a hacer TODO directo (tabla externa + cruce +
      DELETE/INSERT) por cada fecha del rango, escribiendo directo en t_consent_transaction — se
      restauran la carga histórica (RN-IBK-015) y el filtro por MAX(consent_date) (RN-IBK-012),
      ambos con su comportamiento original de antes de RN-IBK-019.
      (2) t_consent_transaction vuelve a guardar el HISTORIAL COMPLETO por cliente (RN-IBK-011
      queda superada): si un id aparece otorgado, luego revocado, luego otorgado de nuevo (en
      archivos/fechas distintas), las 3 filas conviven en la tabla, una por cada consent_date
      real — el DELETE+INSERT es por (itc_company_id, consent_date), nunca colapsa por id.
      (3) Como t_consent_transaction ya no garantiza 1 fila por cliente,
      ba_customer_consent_group_ibk.sql RECUPERA su propio QUALIFY ROW_NUMBER() OVER
      (PARTITION BY id ORDER BY consent_date DESC) = 1 (como antes de RN-IBK-011, 2026-08-25) —
      con un cuidado importante: el ROW_NUMBER se calcula sobre TODOS los eventos de conset_id
      = 'CP_2' del cliente (cualquier consent_type), y RECIÉN sobre la fila con rn=1 se exige
      consent_type = 'otorgado'. Filtrar consent_type ANTES de calcular el ROW_NUMBER sería un
      bug: se podría quedar con un 'otorgado' viejo aunque el cliente haya revocado después. Si
      el último evento real del cliente es 'rechazado', no debe aparecer en
      ba_customer_consent_group aunque haya tenido un 'otorgado' antes.
      NO SE REVIERTEN de RN-IBK-019: el cruce con iden_party sigue siendo SOLO por party_id (sin
      igualar itc_company_id — "no excluir nada" sigue vigente) y ba_customer_consent_group_ibk.sql
      sigue haciendo DELETE por empresa (nunca TRUNCATE) + INSERT completo, llamado una sola vez
      por ejecución del Workflow (no por fecha).
    criticidad: alta
    campo_afectado: t_consent_transaction, ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-021
    descripcion: >
      2 fixes pedidos por el usuario (2026-08-27), en sp_t_consent_transaction_ibk.sql:
      (1) FILTRO DE EMPRESA DESPUÉS DEL CRUCE POR party_id: el cruce contra iden_itc_party_prd
      sigue siendo SOLO por party_id (RN-IBK-019, sin excluir nada — trae los ~6-7M matches), pero
      ahora, sobre ese resultado, se descartan los registros de iden_party de empresas que NO sean
      '000'/'1000' (WHERE itc_company_id IN ('000','1000') dentro del dedup de iden_party). Antes
      no existía ese filtro: una persona con registro en OTRA empresa del grupo (Interseguro,
      Interfondos, etc.) además de Interbank podía colarse en t_consent_transaction con ese otro
      itc_company_id — nunca se había filtrado, solo se filtraba el itc_company_id del ARCHIVO
      (siempre '000'), no el de iden_party.
      (2) DELETE POR record_source, NO POR consent_date — BUG REAL confirmado con datos de dev:
      dos folder_dates DISTINTOS pueden calcular el mismo v_max_consent_date real (confirmado:
      t_consent_transaction_20260813_external y ..._20260814_external, ambos con
      MAX(consent_date) = 2026-08-13) — con el DELETE anterior (por itc_company_id + consent_date,
      RN-IBK-005), al procesar el segundo archivo su DELETE borraba TODO lo que el primero acababa
      de insertar para esa fecha, aunque fueran archivos distintos (pérdida real de ~3.9M filas
      confirmada). Fix: el DELETE ahora es por (itc_company_id, record_source) — record_source
      identifica el ARCHIVO que insertó cada fila (vía source_file_name, que embebe el folder_date
      de forma determinística) — reprocesar la MISMA fecha sigue siendo idempotente, pero un
      archivo nuevo nunca toca las filas insertadas por OTRO archivo, así compartan el mismo
      consent_date real. Costo aceptado: si dos archivos distintos traen genuinamente al mismo
      cliente con el mismo consent_date, ahora pueden convivir 2 filas (antes el segundo
      reemplazaba al primero) — preferible a perder datos silenciosamente.
    criticidad: alta
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-022
    descripcion: >
      BUG REAL confirmado en el primer intento de deploy en producción (2026-08-27):
      sp_t_consent_transaction_ibk.sql construía la ruta de su tabla de stage
      (tmp_t_consent_transaction_ibk_{fecha}) con el proyecto ${project_iden_party} — falló con
      "Dataset prd-itc-data-sensitive:master_stage was not found in location US". La asunción de
      que el dataset de stage vive bajo el mismo proyecto que iden_party era una coincidencia
      SOLO de dev (dev-intercorp-data-operation hospeda tanto iden_party como demo_migracion,
      el dataset de stage en ese ambiente) — en prod, project_iden_party
      (prd-itc-data-sensitive) es un proyecto de datos sensibles/PII que NO hospeda el dataset de
      stage de este módulo; el usuario confirmó que en prod el dataset master_stage vive bajo
      intercorp-data-storage-pv (verificado con datos reales: master_stage existe tanto en
      intercorp-data-storage-pv como en silent-matter-270218/project_operation, pero NO en
      prd-itc-data-sensitive).
      Fix: nueva variable de deploy dedicada ${project_stage} (env_dev.json:
      dev-intercorp-data-operation — preserva el comportamiento ya validado en dev;
      env_prd.json: intercorp-data-storage-pv). sp_t_consent_transaction_ibk.sql y el test
      test_sp_t_consent_transaction_ibk.sql (T7) ahora usan ${project_stage} en vez de
      ${project_iden_party} para la ruta de la tabla de stage. No se reutilizó
      ${project_analytics} (la convención genérica del framework, ver data/rules/bigquery.md)
      porque en dev ese proyecto (dev-itc-customer-services) también tiene un dataset llamado
      demo_migracion, pero no es necesariamente el mismo que usa este módulo — se prefirió una
      variable explícita y sin ambigüedad antes que confiar en otra coincidencia de nombres.
    criticidad: alta
    campo_afectado: t_consent_transaction
    validado_por: lsullon

  - id: RN-IBK-017
    descripcion: >
      ba_customer_consent_group pasa de "DELETE+INSERT acotado por itc_company_id + consent_date
      del scope recién cargado" a un INSERT completo (pedido por el usuario, 2026-08-26):
      reinserta TODO lo que haya en t_consent_transaction que cumpla conset_id = 'CP_2' AND
      consent_type = 'otorgado' (RN-IBK-006), sin ningún filtro de fecha ni de scope.
      ACTUALIZADO por RN-IBK-019 (mismo día): el paso previo de limpieza pasó de TRUNCATE a
      DELETE WHERE itc_company_id IN ('000','1000') — un TRUNCATE borraría filas de otras
      empresas que la tabla pudiera tener. sp_ba_customer_consent_group_ibk.sql deja de leer la
      tabla de scope tmp_t_consent_transaction_ibk_{fecha} (ver RN-IBK-013). El Workflow deja de
      llamar a este SP una vez por cada fecha del rango dentro de iterar_fechas — lo llama UNA
      sola vez, después de terminar el loop de fechas, para no reconstruir la tabla completa N
      veces en el mismo reproceso. p_process_date_ini/end y p_dataset_stage quedan en la firma
      del SP sin usarse para filtrar (decisión explícita del usuario: mantener el parámetro
      aunque no se use) — el Workflow les pasa var_process_dates[0]/var_process_dates[len(...)-1]
      solo para trazabilidad en monitoring. RECUPERA su propio QUALIFY de último evento por
      cliente con RN-IBK-020 (rollback de RN-IBK-011, ver esa entrada) — ya no puede asumir que
      t_consent_transaction viene con 1 sola fila por id.
    criticidad: alta
    campo_afectado: ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-006
    descripcion: >
      ba_customer_consent_group se genera exclusivamente desde t_consent_transaction
      (no vuelve a leer el archivo ni la tabla externa), filtrando conset_id = 'CP_2',
      consent_type = 'otorgado' e itc_company_id IN ('000','1000'). DESDE RN-IBK-020
      (2026-08-27, rollback de RN-IBK-011) SÍ necesita su propio dedup por cliente —
      t_consent_transaction volvió a guardar el historial completo, ya no garantiza 1 fila por
      id — ver el QUALIFY propio de sp_ba_customer_consent_group_ibk.sql (mismo patrón que las
      SPs hermanas de Interseguro/Interfondos). DESDE 2026-08-26 (ver RN-IBK-017) el filtro ya
      no se acota por fecha/scope — corre sobre TODA t_consent_transaction.
    criticidad: alta
    campo_afectado: ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-007
    descripcion: >
      Carga a ba_customer_consent_group es DELETE + INSERT por itc_company_id + consent_date,
      igual que en t_consent_transaction.
    criticidad: alta
    campo_afectado: ba_customer_consent_group
    validado_por: lsullon

  - id: RN-IBK-008
    descripcion: >
      El pipeline completo (gestión de tabla externa + SP t_consent_transaction +
      SP ba_customer_consent_group) se implementa como Stored Procedures orquestados
      en un único Workflow.
    criticidad: media   # regla de arquitectura/orquestación, no verificable con una regla DQ sobre datos
    campo_afectado: orquestación
    validado_por: lsullon

  - id: RN-IBK-009
    descripcion: >
      El Workflow soporta 3 modos de ejecución: normal (sin parámetros, usa fecha de
      sistema), manual (process_date único) y reproceso (process_date_init +
      process_date_fin, ejecutando un ciclo completo por cada día del rango).
    criticidad: media   # regla funcional del Workflow, no verificable con una regla DQ sobre datos

  - id: RN-IBK-010
    descripcion: >
      Una fecha sin archivo en la fuente principal (folder_date sin datos — confirmado que
      ocurre en fines de semana/feriados, RI-IBK-T_CONSENT_TRANSACTION-001) NO detiene el
      resto del proceso: se omite esa fecha (normal/manual: corrida termina OK sin cargar
      nada; reproceso: continúa con la siguiente fecha del rango) y se registra en el
      correo de éxito como fecha omitida — no dispara el correo de error. El histórico de
      la evaluación de integridad (FAILED, sin datos) igual se matricula en
      metadata_operational vía RegisterIntegrityResults, solo cambia que ya no aborta el
      Workflow. El Cloud Scheduler además se ajustó a lunes-viernes para no disparar
      corridas innecesarias los fines de semana.
    criticidad: media   # regla de manejo de errores/orquestación, no verificable con una regla DQ sobre datos
    campo_afectado: orquestación
    validado_por: lsullon
    campo_afectado: "parámetros de ejecución del Workflow"
    validado_por: lsullon

# ------------------------------------------------------------
# 6. COMPONENTES GCP
# ------------------------------------------------------------
componentes:
  - tipo: ddl
    archivo: data/bigquery/master_party/t_consent_transaction/ddl/ddl_dq_config.sql
    descripcion: "CREATE TABLE IF NOT EXISTS dq_config (etapas.data_quality: true) — tabla compartida entre módulos de ${dataset_dq}, ver data/standard/data-quality.md. Agregado 2026-08-20 tras fallo de deploy-dml: la tabla nunca se creó, solo se generó su INSERT"

  - tipo: ddl
    archivo: data/bigquery/master_party/t_consent_transaction/ddl/ddl_dq_control.sql
    descripcion: "CREATE TABLE IF NOT EXISTS dq_control (etapas.data_quality: true) — tabla compartida entre módulos de ${dataset_dq}, mismo fix que ddl_dq_config.sql"

  - tipo: ddl
    archivo: data/bigquery/master_party/t_consent_transaction/ddl/ext_t_consent_transaction_external.sql
    descripcion: "REFERENCIA — no se despliega vía bigquery_ddl (nombre dinámico). Documenta el DDL de la tabla externa temporal (TTL 2 días, RN-IBK-001) que sp_t_consent_transaction_ibk.sql crea dinámicamente vía EXECUTE IMMEDIATE con el nombre t_consent_transaction_{fecha_archivo}_external"

  - tipo: ddl
    archivo: data/bigquery/master_party/t_consent_transaction/ddl/t_consent_transaction.sql
    descripcion: "Tabla destino particionada por consent_date, clustered por itc_company_name. Guarda el HISTORIAL COMPLETO por cliente (RN-IBK-020)"

  - tipo: ddl
    archivo: data/bigquery/master_party/t_consent_transaction/alter/alter_t_consent_transaction_20260819_001.sql
    descripcion: "ADD COLUMN dq_flag_ind/dq_control_msg/dq_config_id (REGLA 4 fac-data-rules-check, etapas.data_quality: true) — no poblados aún, ver nota en el archivo"

  - tipo: sp
    archivo: data/bigquery/master_party/t_consent_transaction/sp/sp_t_consent_transaction_ibk.sql
    descripcion: "folder_date = p_process_date_ini directo, sin offset (RN-IBK-014). Cruce con iden_itc_party SOLO por party_id (RN-IBK-019, sin excluir nada), filtrando DESPUÉS del match a itc_company_id IN ('000','1000') (RN-IBK-021), filtra por consent_date = MAX(consent_date) real del archivo salvo carga histórica (p_carga_historica, RN-IBK-015), hace delete/insert por (itc_company_id, record_source) — no por consent_date, evita colisión entre archivos con el mismo MAX(consent_date), RN-IBK-021 — guarda el HISTORIAL COMPLETO por cliente, sin QUALIFY (RN-IBK-020, rollback de RN-IBK-011), arma record_source = LPDP_IBK_{archivo} vía _FILE_NAME (RN-IBK-016), y usa una tabla temporal con sufijo de fecha (RN-IBK-013) en el proyecto ${project_stage} (RN-IBK-022 — variable dedicada, no ${project_iden_party})"

  - tipo: sp
    archivo: data/bigquery/master_party/t_consent_transaction/sp/sp_integridad_t_consent_transaction.sql
    descripcion: "Gate de integridad — actualidad D-1 de consentimiento_ibk_archivo (RI-IBK-...-001), folder_date = p_process_date_ini directo sin offset (RN-IBK-014). NO se invoca desde el Workflow desde 2026-08-26 (RN-IBK-018, etapas.integridad: false) — el archivo queda en el repo, sin desplegarse/llamarse"

  - tipo: sp
    archivo: data/bigquery/master_party/t_consent_transaction/sp/sp_dq_t_consent_transaction.sql
    descripcion: "SP DQ — valida las 3 reglas de t_consent_transaction contra dq_config, registra en dq_control. NO se invoca desde el Workflow desde 2026-08-26 (RN-IBK-018, etapas.data_quality: false) — el archivo queda en el repo, sin desplegarse/llamarse"

  - tipo: ddl
    archivo: data/bigquery/master_party/ba_customer_consent_group/ddl/ba_customer_consent_group.sql
    descripcion: "Tabla destino particionada por consent_date"

  - tipo: ddl
    archivo: data/bigquery/master_party/ba_customer_consent_group/alter/alter_ba_customer_consent_group_20260819_001.sql
    descripcion: "ADD COLUMN dq_flag_ind/dq_control_msg/dq_config_id (REGLA 4 fac-data-rules-check, etapas.data_quality: true) — no poblados aún"

  - tipo: sp
    archivo: data/bigquery/master_party/ba_customer_consent_group/sp/sp_ba_customer_consent_group_ibk.sql
    descripcion: "DELETE por itc_company_id (NUNCA TRUNCATE, RN-IBK-019) + INSERT completo de TODO lo que cumpla CP_2/otorgado en t_consent_transaction — sin filtro de fecha ni scope (RN-IBK-017). Con su PROPIO QUALIFY de último evento por cliente (RN-IBK-020, rollback de RN-IBK-011: t_consent_transaction ya no viene deduplicada). Llamada UNA sola vez por ejecución del Workflow, al final del loop de fechas. p_process_date_ini/end y p_dataset_stage quedan en la firma sin usarse para filtrar (decisión del usuario)"

  - tipo: sp
    archivo: data/bigquery/master_party/ba_customer_consent_group/sp/sp_dq_ba_customer_consent_group.sql
    descripcion: "SP DQ — valida las 2 reglas de ba_customer_consent_group contra dq_config, registra en dq_control. NO se invoca desde el Workflow desde 2026-08-26 (RN-IBK-018, etapas.data_quality: false) — el archivo queda en el repo, sin desplegarse/llamarse"

  - tipo: workflow
    archivo: pipeline/workflow/master_party/t_consent_transaction/wf-ibk-consentimiento.yaml
    descripcion: "Orquesta tabla externa + SP1 (por cada fecha del rango, directo a t_consent_transaction) + SP2 (una sola vez, al final, RN-IBK-017); soporta process_date normal/manual/reproceso. Aplica el offset de -1 día solo en modo normal (RN-IBK-014); en reproceso verifica si hay datos previos de Interbank para decidir carga histórica del primer archivo (RN-IBK-015). Sin gates de integridad/DQ (RN-IBK-018) — solo procesa/inserta y registra en la API de monitoring; fecha sin archivo se detecta por el RAISE propio de SP1"

  - tipo: cloud_scheduler
    archivo: pipeline/scheduler/master_party/t_consent_transaction/cs-ibk-consentimiento.yaml
    descripcion: "Disparo diario del workflow (flujo normal)"

# ------------------------------------------------------------
# 7. DATA QUALITY
# ------------------------------------------------------------
data_quality:
  dataset_dq: "${dataset_dq}"
  reglas:
    - id: DQ-IBK-T_CONSENT_TRANSACTION-001
      dimension: completitud
      tipo: technical
      campo: id
      critica: true
      umbral_max_pct_invalidos: 0
      sql_rule: >
        SELECT *
        FROM `${project_t_consent_transaction}.${dataset_t_consent_transaction}.t_consent_transaction`
        WHERE id IS NULL

    - id: DQ-IBK-T_CONSENT_TRANSACTION-002
      dimension: completitud
      tipo: technical
      campo: consent_date
      critica: true
      umbral_max_pct_invalidos: 0
      sql_rule: >
        SELECT *
        FROM `${project_t_consent_transaction}.${dataset_t_consent_transaction}.t_consent_transaction`
        WHERE consent_date IS NULL
      # cubre RN-IBK-004 — consent_date debe venir siempre del contenido real del archivo

    - id: DQ-IBK-T_CONSENT_TRANSACTION-003
      dimension: unicidad
      tipo: technical
      campo: conset_transaction_id
      critica: true
      umbral_max_pct_invalidos: 0
      sql_rule: >
        SELECT itc_company_id, consent_date, conset_transaction_id, COUNT(*) AS cnt
        FROM `${project_t_consent_transaction}.${dataset_t_consent_transaction}.t_consent_transaction`
        GROUP BY itc_company_id, consent_date, conset_transaction_id
        HAVING cnt > 1
      # cubre RN-IBK-005 — detecta duplicados si el delete+insert por itc_company_id+consent_date falla o se reprocesa mal

    - id: DQ-IBK-BA_CUSTOMER_CONSENT_GROUP-001
      dimension: validez
      tipo: business
      campo: itc_company_id
      critica: true
      umbral_max_pct_invalidos: 0
      sql_rule: >
        SELECT *
        FROM `${project_ba_customer_consent_group}.${dataset_ba_customer_consent_group}.ba_customer_consent_group`
        WHERE itc_company_id NOT IN ('000','1000')
      # cubre RN-IBK-006 — nota: conset_id/consent_type no se persisten en este output, por lo que el filtro
      # CP_2/otorgado solo puede validarse indirectamente vía itc_company_id; considerar agregar esos campos
      # al output si se requiere una validación DQ más estricta

    - id: DQ-IBK-BA_CUSTOMER_CONSENT_GROUP-002
      dimension: unicidad
      tipo: technical
      campo: id
      critica: true
      umbral_max_pct_invalidos: 0
      sql_rule: >
        SELECT itc_company_id, consent_date, id, COUNT(*) AS cnt
        FROM `${project_ba_customer_consent_group}.${dataset_ba_customer_consent_group}.ba_customer_consent_group`
        GROUP BY itc_company_id, consent_date, id
        HAVING cnt > 1
      # cubre RN-IBK-007 — detecta duplicados si el delete+insert por itc_company_id+consent_date falla

# ------------------------------------------------------------
# 8. SEGURIDAD
# ------------------------------------------------------------
seguridad:
  campos_pii_fuente: [documento_legal_id, signed_document, employee_id]
  campos_pii_output: [documento_legal_id, signed_document]
  encriptacion_requerida: true    # confirmado por Data Owner (lmorales) — documento_legal_id/signed_document requieren AEAD
  hash_iden_party: false           # se usa el id ya resuelto de iden_itc_party_prd, no se calcula hash local
  permisos:
    - sa: "${service_account_job}"   # confirmado (2026-08-19): SA compartida ya provisionada con acceso a las tablas de este módulo, ver env_dev.json
      recurso: "dev-intercorp-data-operation.matillion_dev.iden_itc_party_prd"
      permiso: roles/bigquery.dataViewer
    - sa: "${service_account_job}"   # confirmado (2026-08-19): SA compartida ya provisionada con acceso a las tablas de este módulo, ver env_dev.json
      recurso: "dev-intercorp-data-storage.master_party"
      permiso: roles/bigquery.dataEditor
  nota: >
    Confirmado por Data Owner (lmorales): documento_legal_id y signed_document requieren
    encriptación AEAD.ENCRYPT en capa master — usar el catálogo de llaves
    process_ctr_protected_data (ver data/standard/architecture/data-platform-layers.md §7).
    Implementar en etapa CODING antes de habilitar producción.

