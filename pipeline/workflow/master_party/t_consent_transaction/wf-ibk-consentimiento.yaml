name: ${env}-t-consent-transaction-ibk
region: us-central1
project: ${project_operation}
description: "Centralización de Consentimientos LPDP Interbank (IBK) — t_consent_transaction + ba_customer_consent_group"
service_account: ${service_account_job}
source:
  main:
    params: [args]
    steps:

      # ============================================================
      # 1. INICIALIZACIÓN DE VARIABLES
      # ============================================================
      - set_vars:
          assign:
            # Proyecto de billing BigQuery (OBLIGATORIO)
            - v_billing_project: ${project_operation}

            # Stored Procedures (path completo — nunca hardcodeado)
            - var_sp_t_consent_transaction: ${project_operation}.${dataset_sp}.sp_t_consent_transaction_ibk
            - var_sp_ba_customer_consent_group: ${project_operation}.${dataset_sp}.sp_ba_customer_consent_group_ibk

            # Fuente: consentimiento_ibk_archivo (tabla externa dinámica)
            - var_project_archivo: ${project_consentimiento_ibk_archivo}
            - var_dataset_archivo: ${dataset_consentimiento_ibk_archivo}

            # Fuente: iden_party (iden_itc_party_prd)
            - var_project_iden_party: ${project_iden_party}
            - var_dataset_iden_party: ${dataset_iden_party}
            - var_table_iden_party: ${table_iden_party}

            # Output 1: t_consent_transaction
            - var_project_tct: ${project_t_consent_transaction}
            - var_dataset_tct: ${dataset_t_consent_transaction}
            - var_table_tct: ${table_t_consent_transaction}

            # Output 2: ba_customer_consent_group
            - var_project_bccg: ${project_ba_customer_consent_group}
            - var_dataset_bccg: ${dataset_ba_customer_consent_group}
            - var_table_bccg: ${table_ba_customer_consent_group}

            # Stage compartido entre los 2 SPs (tablas tmp_*)
            - var_dataset_stage: ${dataset_stage}

            # Contador de fechas procesadas (para el mail de éxito) y checkpoint de reanudación
            - var_fechas_procesadas: 0
            - var_ultima_fecha_intentada: ""
            # Fechas sin archivo en origen (fines de semana, feriados) — se omiten, no son error.
            # RN-IBK-010: confirmado con el usuario (2026-08-24) que estos huecos son esperados.
            - var_fechas_sin_archivo: []

            # --- MONITORING [etapas.monitoring: true] ---
            - var_METADATA_API_URL: ${METADATA_API_URL}
            - var_process_code: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
            - var_execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
            - var_execution_date: ${text.substring(time.format(sys.now(), "America/Lima"), 0, 10)}
            - var_user: ${sys.get_env("GOOGLE_CLOUD_SERVICE_ACCOUNT_NAME")}
            - var_process_flag_active: "1"
            - var_process_flag_reprocess: "0"
            - var_process_flag_scheduler: "1"
            - var_execution_type: "NORMAL"
            - execution_data_read: 0
            - execution_data_write: 0
            - object_last_load_date: null

            # Email body — inicializar siempre
            - email_body: {}

      # ============================================================
      # 2. DETERMINAR MODO DE EJECUCIÓN [RN-IBK-009]
      # ============================================================
      # normal    → sin argumentos: usa la fecha de sistema ACTUAL (no "ayer" — a diferencia del
      #             default estándar del framework. El offset de 1 día ya lo aplica el SP sobre
      #             process_date para calcular folder_date [RN-IBK-002], así que aquí process_date
      #             debe ser HOY, no ayer)
      # manual    → args.process_date con una fecha específica
      # reproceso → args.process_date_init + args.process_date_fin (rango, ambos inclusive)
      - normalizar_args:
          assign:
            - _param_fecha: ${text.replace_all(string(map.get(args, "process_date")), " ", "")}
            - _param_init: ${text.replace_all(string(map.get(args, "process_date_init")), " ", "")}
            - _param_fin: ${text.replace_all(string(map.get(args, "process_date_fin")), " ", "")}

      - decidir_modo:
          switch:
            - condition: ${_param_init != "" and _param_init != "null" and _param_fin != "" and _param_fin != "null"}
              next: modo_reproceso
            - condition: ${_param_fecha != "" and _param_fecha != "null"}
              next: modo_manual
            - condition: ${true}
              next: modo_normal

      # ---- Modo normal: fecha de sistema actual (America/Lima) ----
      # [RN-IBK-014, 2026-08-26] El offset de -1 día (archivo de ayer) se aplica AQUÍ, no en el
      # SP — var_process_dates queda con la carpeta real a leer, igual que manual/reproceso
      # (que nunca llevan offset, la fecha que manda el usuario ya es la carpeta exacta).
      - modo_normal:
          call: googleapis.bigquery.v2.jobs.query
          args:
            projectId: ${v_billing_project}
            body:
              useLegacySql: false
              query: "SELECT FORMAT_DATE('%F', DATE_SUB(CURRENT_DATE('America/Lima'), INTERVAL 1 DAY)) AS fecha"
          result: bqFechaHoy
          next: set_fecha_normal

      - set_fecha_normal:
          assign:
            - var_modo: "normal"
            - var_process_dates: [ '${bqFechaHoy.rows[0].f[0].v}' ]
          next: log_modo

      # ---- Modo manual: una sola fecha indicada por el usuario ----
      - modo_manual:
          assign:
            - var_modo: "manual"
            - var_process_dates: [ '${_param_fecha}' ]
          next: log_modo

      # ---- Modo reproceso: SOLO el último archivo del rango [RN-IBK-025, 2026-08-28] ----
      # CORRECCIÓN (pedido por el usuario): el archivo de origen es un extracto COMPLETO/acumulado,
      # no incremental — ya no tiene sentido reprocesar día por día. Se toma process_date_fin
      # directamente, sin generar ni iterar el rango completo (RN-IBK-025 supera el loop anterior).
      - modo_reproceso:
          assign:
            - var_modo: "reproceso"
            - var_process_dates: [ '${_param_fin}' ]
          next: log_modo

      - log_modo:
          call: sys.log
          args:
            json:
              modo: ${var_modo}
              cantidad_fechas: ${len(var_process_dates)}
              fechas: ${var_process_dates}
            severity: INFO

      # execution_type para monitoring: refleja el modo real de esta corrida (no solo "NORMAL")
      - set_execution_type:
          assign:
            - var_execution_type: ${text.to_upper(var_modo)}

      # ============================================================
      # 3. EJECUCIÓN — SP1 UNA sola vez (último archivo), SP2 UNA sola vez después
      # ============================================================
      # CORRECCIÓN (2026-08-28, RN-IBK-025, pedido por el usuario) — SUPERA RN-IBK-020: ya no hay
      # loop por fecha. El archivo de origen es un extracto COMPLETO/acumulado (no incremental),
      # así que solo tiene sentido procesar el ÚLTIMO archivo — normal/manual ya eran un solo
      # archivo; reproceso ahora también (var_process_dates ya trae un único elemento, ver
      # modo_reproceso más arriba). Con esto desaparece también la lógica de carga histórica
      # (RN-IBK-015, superada — ya no hace falta distinguir "primer archivo del reproceso": todo
      # archivo se carga completo, ver sp_t_consent_transaction_ibk.sql). SP2
      # (sp_ba_customer_consent_group_ibk) sigue llamándose una sola vez, después de SP1
      # (RN-IBK-017, no se revierte).
      - ejecutar:
          try:
            steps:
              - set_fecha_actual:
                  assign:
                    - fecha_actual: ${var_process_dates[0]}
                    # Checkpoint: si el proceso falla, el except abajo sabe exactamente qué fecha
                    # se estaba procesando.
                    - var_ultima_fecha_intentada: ${fecha_actual}

              - log_inicio_fecha:
                  call: sys.log
                  args:
                    text: ${"[INFO] Procesando process_date = " + fecha_actual}
                    severity: INFO

              # -------- SP 1: sp_t_consent_transaction_ibk --------
              - build_sql_tct_p1:
                  assign:
                    # p_process_date_ini = p_process_date_end = fecha_actual — este SP
                    # siempre procesa una única fecha (data/rules/bigquery.md).
                    - sql_tct_p1: ${"DECLARE v_read INT64 DEFAULT 0; "
                        + "DECLARE v_write INT64 DEFAULT 0; "
                        + "CALL `" + var_sp_t_consent_transaction + "`("
                        + "DATE '" + fecha_actual + "'"
                        + ", DATE '" + fecha_actual + "'"
                        + ", '" + var_project_archivo + "'"
                        + ", '" + var_dataset_archivo + "'"}

              - build_sql_tct_p2:
                  assign:
                    - sql_tct_p2: ${", '" + var_project_iden_party + "'"
                        + ", '" + var_dataset_iden_party + "'"
                        + ", '" + var_table_iden_party + "'"
                        + ", '" + var_project_tct + "'"
                        + ", '" + var_dataset_tct + "'"
                        + ", '" + var_table_tct + "'"}

              - build_sql_tct_p3:
                  assign:
                    # p_carga_historica eliminado de la firma del SP [RN-IBK-025] — ya no se pasa.
                    - sql_tct_p3: ${", '" + var_dataset_stage + "'"
                        + ", v_read, v_write); "
                        + "SELECT v_read AS execution_data_read, v_write AS execution_data_write"}

              - build_sql_tct:
                  assign:
                    - query_tct: ${sql_tct_p1 + sql_tct_p2 + sql_tct_p3}

              - log_query_tct:
                  call: sys.log
                  args:
                    text: ${"[BUILD] query_tct = " + query_tct}
                    severity: INFO

              # invoque_sp_tct queda envuelto en su propio try/except (CAMBIO DE DISEÑO
              # 2026-08-26, quitados los gates de integridad/DQ): antes, una fecha sin
              # archivo se detectaba ANTES de llamar a este SP, vía el SP de integridad
              # (etapas.integridad, eliminado). Ahora sp_t_consent_transaction_ibk.sql ya
              # lanza su propio RAISE cuando la tabla externa tiene 0 filas (ver su punto
              # 4) — se reutiliza ESE error para decidir "sin archivo" (RN-IBK-010) en vez
              # de un chequeo previo separado.
              - invoque_sp_tct:
                  try:
                    steps:
                      - invoque_sp_tct_call:
                          call: TrackedBigQueryJobWithResults
                          args:
                            api_url: ${var_METADATA_API_URL}
                            process_code: ${var_process_code}
                            execution_id: ${var_execution_id}
                            task_code: ${var_sp_t_consent_transaction}
                            execution_type: ${var_execution_type}
                            process_date_init: ${fecha_actual}
                            process_date_end: ${fecha_actual}
                            user: ${var_user}
                            query: ${query_tct}
                            project_id: ${v_billing_project}
                          result: tracked_result_tct
                  except:
                    as: e_tct
                    steps:
                      # Distingue "sin archivo" (mensaje conocido del RAISE del SP, ver su
                      # punto 4) de un error real — solo el primero se omite en silencio.
                      - evaluar_error_tct:
                          switch:
                            - condition: ${"status" in e_tct and "errorResult" in e_tct.status and text.match_regex(e_tct.status.errorResult.message, "no se ejecuta DELETE sin INSERT de reemplazo")}
                              next: registrar_fecha_sin_archivo
                            - condition: ${true}
                              raise: ${e_tct}

              - set_metricas_tct:
                  assign:
                    - execution_data_read: ${tracked_result_tct.execution_data_read}
                    - execution_data_write: ${tracked_result_tct.execution_data_write}
                    - object_last_load_date: ${tracked_result_tct.object_last_load_date}

              - log_fin_fecha:
                  assign:
                    - var_fechas_procesadas: ${var_fechas_procesadas + 1}
                  next: build_sql_bccg_p1

              # [RN-IBK-010] Sin archivo NO es un error — se omite esta fecha y de todas formas
              # se llama a SP2 (refleja lo que ya haya en t_consent_transaction).
              - registrar_fecha_sin_archivo:
                  assign:
                    - var_fechas_sin_archivo: ${list.concat(var_fechas_sin_archivo, fecha_actual)}
                  next: log_fecha_sin_archivo

              - log_fecha_sin_archivo:
                  call: sys.log
                  args:
                    text: ${"[INFO] Sin archivo para folder_date de " + fecha_actual + " — se omite."}
                    severity: INFO
                  next: build_sql_bccg_p1

              # -------- SP 2: sp_ba_customer_consent_group_ibk --------
              # DELETE por empresa + INSERT de TODO t_consent_transaction filtrado por
              # CP_2/otorgado, con su propio QUALIFY de último evento por cliente (RN-IBK-020) —
              # sin cambios en esta corrección. p_process_date_ini/end ya no filtran datos dentro
              # del SP (se mantienen en la firma por decisión del usuario) — aquí se les pasa la
              # fecha real de esta corrida solo para trazabilidad en monitoring.
              - build_sql_bccg_p1:
                  assign:
                    - sql_bccg_p1: ${"DECLARE v_read INT64 DEFAULT 0; "
                        + "DECLARE v_write INT64 DEFAULT 0; "
                        + "CALL `" + var_sp_ba_customer_consent_group + "`("
                        + "DATE '" + var_process_dates[0] + "'"
                        + ", DATE '" + var_process_dates[len(var_process_dates) - 1] + "'"
                        + ", '" + var_project_bccg + "'"}

              - build_sql_bccg_p2:
                  assign:
                    - sql_bccg_p2: ${", '" + var_dataset_bccg + "'"
                        + ", '" + var_table_bccg + "'"
                        + ", '" + var_project_tct + "'"
                        + ", '" + var_dataset_tct + "'"
                        + ", '" + var_table_tct + "'"}

              - build_sql_bccg_p3:
                  assign:
                    - sql_bccg_p3: ${", '" + var_dataset_stage + "'"
                        + ", v_read, v_write); "
                        + "SELECT v_read AS execution_data_read, v_write AS execution_data_write"}

              - build_sql_bccg:
                  assign:
                    - query_bccg: ${sql_bccg_p1 + sql_bccg_p2 + sql_bccg_p3}

              - log_query_bccg:
                  call: sys.log
                  args:
                    text: ${"[BUILD] query_bccg = " + query_bccg}
                    severity: INFO

              - invoque_sp_bccg:
                  call: TrackedBigQueryJobWithResults
                  args:
                    api_url: ${var_METADATA_API_URL}
                    process_code: ${var_process_code}
                    execution_id: ${var_execution_id}
                    task_code: ${var_sp_ba_customer_consent_group}
                    execution_type: ${var_execution_type}
                    process_date_init: ${var_process_dates[0]}
                    process_date_end: ${var_process_dates[len(var_process_dates) - 1]}
                    user: ${var_user}
                    query: ${query_bccg}
                    project_id: ${v_billing_project}
                  result: tracked_result_bccg

              - set_metricas_bccg:
                  assign:
                    - execution_data_read: ${tracked_result_bccg.execution_data_read}
                    - execution_data_write: ${tracked_result_bccg.execution_data_write}
                    - object_last_load_date: ${tracked_result_bccg.object_last_load_date}

              # MONITORING: marca el proceso como SUCCESS una vez procesadas todas las fechas
              - update_process_success:
                  call: UpdateProcessStatus
                  args:
                    api_url: ${var_METADATA_API_URL}
                    process_code: ${var_process_code}
                    execution_date: ${var_execution_date}
                    status: "SUCCESS"
                    user: ${var_user}
                    flag_active: ${var_process_flag_active}
                    flag_reprocess: ${var_process_flag_reprocess}
                    flag_scheduler: ${var_process_flag_scheduler}
                  result: process_success_response

          except:
            as: e
            steps:
              # Checkpoint impreso en logs: en qué fecha se quedó, para reanudar desde ahí
              # (no re-ejecutar todo el rango de nuevo — las fechas previas ya están confirmadas).
              - log_error:
                  call: sys.log
                  args:
                    json:
                      status: FAILED
                      modo: ${var_modo}
                      fechas_procesadas_antes_del_error: ${var_fechas_procesadas}
                      checkpoint_ultima_fecha_intentada: ${var_ultima_fecha_intentada}
                      error: ${e}
                    severity: ERROR

              # MONITORING: marca el proceso como FAILED — no debe romper el pipeline por sí mismo,
              # pero aquí no hace falta try/except propio porque ya estamos en el except principal
              - update_process_failed:
                  call: UpdateProcessStatus
                  args:
                    api_url: ${var_METADATA_API_URL}
                    process_code: ${var_process_code}
                    execution_date: ${var_execution_date}
                    status: "FAILED"
                    user: ${var_user}
                    flag_active: ${var_process_flag_active}
                    flag_reprocess: ${var_process_flag_reprocess}
                    flag_scheduler: ${var_process_flag_scheduler}
                  result: process_failed_response

              - armar_sugerencia_reanudacion:
                  switch:
                    - condition: ${var_modo == "reproceso"}
                      next: sugerencia_reproceso
                    - condition: ${true}
                      next: sugerencia_simple

              - sugerencia_reproceso:
                  assign:
                    - var_sugerencia_reanudacion: ${"Para continuar el reproceso desde donde se quedó, ejecutar nuevamente con process_date_init - "
                        + var_ultima_fecha_intentada + " y process_date_fin - " + _param_fin + "."}
                  next: build_content_error_p1

              - sugerencia_simple:
                  assign:
                    - var_sugerencia_reanudacion: ${"Reintentar manualmente con process_date - " + var_ultima_fecha_intentada + "."}
                  next: build_content_error_p1

              # Expresión partida en 2 — GCP Workflows limita cada expresión ${...} a 400 caracteres
              - build_content_error_p1:
                  assign:
                    - content_error_p1: ${"<p>Se detectó un error procesando consentimientos LPDP de Interbank (modo - "
                        + var_modo + ").</p>"
                        + "<p>CHECKPOINT — última fecha intentada (donde se detuvo) - " + var_ultima_fecha_intentada + "</p>"}

              - build_content_error_p2:
                  assign:
                    - content_error_p2: ${"<p>Fechas procesadas correctamente antes del error - " + string(var_fechas_procesadas) + "</p>"
                        + "<p>" + var_sugerencia_reanudacion + "</p>"
                        + "<p>Detalle - " + text.decode(json.encode(e)) + "</p>"}

              - handle_error:
                  assign:
                    - email_body:
                        subject: "[IBK-CONSENTIMIENTO] Centralización LPDP [❌ ERROR]"
                        content: ${content_error_p1 + content_error_p2}
                        toAddress:
                          - "lsullonm@intercorp.com.pe"   # ⚠️ SOLO PARA PRUEBAS — reemplazar por los destinatarios reales antes de producción
                  next: enviar_mail

      # ============================================================
      # 4. NOTIFICACIÓN OK
      # ============================================================
      # [RN-IBK-010] Fechas sin archivo (omitidas, no error) — se informan en el correo de éxito.
      - set_fechas_sin_archivo_txt:
          switch:
            - condition: ${len(var_fechas_sin_archivo) > 0}
              assign:
                - var_fechas_sin_archivo_txt: ${"<p>Fechas sin archivo en origen (omitidas) - "
                    + string(len(var_fechas_sin_archivo)) + " - "
                    + text.decode(json.encode(var_fechas_sin_archivo)) + "</p>"}
            - condition: ${true}
              assign:
                - var_fechas_sin_archivo_txt: ""

      - notificar_ok:
          assign:
            - email_body:
                subject: "[IBK-CONSENTIMIENTO] Centralización LPDP [✅ OK]"
                content: ${"<p>Proceso finalizado correctamente. Modo - " + var_modo
                    + ". Fechas procesadas - " + string(var_fechas_procesadas) + "</p>"
                    + var_fechas_sin_archivo_txt}
                toAddress:
                  - "lsullonm@intercorp.com.pe"   # ⚠️ SOLO PARA PRUEBAS — reemplazar por los destinatarios reales antes de producción

      # ============================================================
      # 5. ENVÍO DE MAIL VÍA PUB/SUB
      # ============================================================
      - verificar_email_body:
          switch:
            - condition: ${"subject" in email_body and email_body.subject != "" and
                          "content" in email_body and email_body.content != "" and
                          "toAddress" in email_body and len(email_body.toAddress) > 0}
              next: enviar_mail
            - condition: ${true}
              next: MainResponse

      - enviar_mail:
          call: http.post
          args:
            url: "https://pubsub.googleapis.com/v1/projects/${mail_pubsub_project}/topics/${mail_pubsub_topic}:publish"
            auth:
              type: OAuth2
            body:
              messages:
                - data: ${base64.encode(json.encode(email_body))}
          result: pubResp

      - MainResponse:
          return:
            status: "SUCCESS"
            mensaje: ${"Centralización de consentimientos LPDP IBK ejecutada — modo " + var_modo + ", " + string(var_fechas_procesadas) + " fecha(s) procesada(s)"}
            process_code: ${var_process_code}
            execution_id: ${var_execution_id}
            modo: ${var_modo}
            fechas_procesadas: ${var_fechas_procesadas}
            execution_data_read: ${execution_data_read}
            execution_data_write: ${execution_data_write}
            object_last_load_date: ${object_last_load_date}

  # ============================================================
  # SUBWORKFLOWS REUTILIZABLES
  # ============================================================
  # Ejecuta un query síncrono contra BigQuery y devuelve los resultados (usada para leer los OUT
  # de los SP y para el chequeo de carga histórica).
  SyncBigQueryJobWithResults:
    params: [query, project_id]
    steps:
      - JobQuery:
          call: googleapis.bigquery.v2.jobs.query
          args:
            projectId: ${project_id}
            body:
              query: ${query}
              useLegacySql: false
              timeoutMs: 1000
          result: jobQueryResponse

      - JobWait:
          call: BigQueryJobState
          args:
            job_id: ${jobQueryResponse.jobReference.jobId}
            project_id: ${project_id}
          result: jobGetResponse

      - GetResults:
          call: googleapis.bigquery.v2.jobs.getQueryResults
          args:
            projectId: ${project_id}
            jobId: ${jobQueryResponse.jobReference.jobId}
            maxResults: 10
          result: queryResults

      - Return:
          return: ${queryResults}

  # MONITORING [etapas.monitoring: true] — encapsula crear ejecución (RUNNING) → ejecutar SP →
  # actualizar ejecución (SUCCESS/FAILED). Usado por invoque_sp_tct / invoque_sp_bccg.
  TrackedBigQueryJobWithResults:
    params:
      - api_url
      - process_code
      - execution_id
      - task_code
      - execution_type
      - process_date_init
      - process_date_end
      - user
      - query
      - project_id
    steps:
      - create_execution_running:
          call: CreateExecution
          args:
            api_url: ${api_url}
            process_code: ${process_code}
            execution_id: ${execution_id}
            task_code: ${task_code}
            execution_type: ${execution_type}
            execution_status_code: "RUNNING"
            execution_data_read: 0
            execution_data_write: 0
            process_date_init: ${process_date_init}
            process_date_end: ${process_date_end}
            user: ${user}
          result: create_execution_response

      - ejecutar_bigquery:
          try:
            steps:
              - execute_query:
                  call: SyncBigQueryJobWithResults
                  args:
                    query: ${query}
                    project_id: ${project_id}
                  result: sp_result

              - set_metrics:
                  assign:
                    - execution_data_read: ${int(sp_result.rows[0].f[0].v)}
                    - execution_data_write: ${int(sp_result.rows[0].f[1].v)}
                    - object_last_load_date: ${text.substring(time.format(sys.now(), "America/Lima"), 0, 19)}

              - update_execution_success:
                  call: UpdateExecution
                  args:
                    api_url: ${api_url}
                    process_code: ${process_code}
                    execution_id: ${execution_id}
                    task_code: ${task_code}
                    object_last_load_date: ${object_last_load_date}
                    execution_type: ${execution_type}
                    execution_status_code: "SUCCESS"
                    execution_data_read: ${execution_data_read}
                    execution_data_write: ${execution_data_write}
                    process_date_init: ${process_date_init}
                    process_date_end: ${process_date_end}
                    user: ${user}
                  result: update_execution_success_response

              - return_success:
                  return:
                    status: "SUCCESS"
                    execution_data_read: ${execution_data_read}
                    execution_data_write: ${execution_data_write}
                    object_last_load_date: ${object_last_load_date}
                    bq_result: ${sp_result}

          except:
            as: e
            steps:
              - update_execution_failed:
                  call: UpdateExecution
                  args:
                    api_url: ${api_url}
                    process_code: ${process_code}
                    execution_id: ${execution_id}
                    task_code: ${task_code}
                    object_last_load_date: null
                    execution_type: ${execution_type}
                    execution_status_code: "FAILED"
                    execution_data_read: 0
                    execution_data_write: 0
                    process_date_init: ${process_date_init}
                    process_date_end: ${process_date_end}
                    user: ${user}
                  result: update_execution_failed_response

              - raise_error:
                  raise: ${e}

  # MONITORING — nunca debe romper el pipeline: atrapa su propio error y loguea WARNING.
  CreateExecution:
    params:
      - api_url
      - process_code
      - execution_id
      - task_code
      - execution_type
      - execution_status_code
      - execution_data_read
      - execution_data_write
      - process_date_init
      - process_date_end
      - user
    steps:
      - call_api:
          try:
            call: http.post
            args:
              url: ${api_url + "/api/v1/pipeline-management/pipelines/" + process_code + "/task-execution/creation"}
              auth:
                type: OIDC
                audience: ${api_url}
              body:
                execution_id: ${execution_id}
                process_code: ${process_code}
                task_code: ${task_code}
                object_last_load_date: null
                execution_type: ${execution_type}
                execution_status_code: ${execution_status_code}
                execution_data_read: ${execution_data_read}
                execution_data_write: ${execution_data_write}
                creation_user: ${user}
                process_date_init: ${process_date_init}
                process_date_end: ${process_date_end}
            result: api_response
          except:
            as: e
            steps:
              - log_registro_fallido:
                  call: sys.log
                  args:
                    text: ${"[MONITORING] No se pudo crear el registro de ejecución - " + json.encode_to_string(e)}
                    severity: WARNING
              - return_error:
                  return: null

      - return_response:
          return: ${api_response.body}

  # MONITORING — nunca debe romper el pipeline: se invoca también desde el except de
  # TrackedBigQueryJobWithResults, así que un fallo aquí no debe tapar el error real de BigQuery.
  UpdateExecution:
    params:
      - api_url
      - process_code
      - execution_id
      - task_code
      - object_last_load_date
      - execution_type
      - execution_status_code
      - execution_data_read
      - execution_data_write
      - process_date_init
      - process_date_end
      - user
    steps:
      - call_api:
          try:
            call: http.put
            args:
              url: ${api_url + "/api/v1/pipeline-management/pipelines/" + process_code + "/task-execution/" + execution_id + "/" + task_code + "/update_new"}
              auth:
                type: OIDC
                audience: ${api_url}
              body:
                execution_id: ${execution_id}
                process_code: ${process_code}
                task_code: ${task_code}
                object_last_load_date: ${object_last_load_date}
                execution_type: ${execution_type}
                execution_status_code: ${execution_status_code}
                execution_data_read: ${execution_data_read}
                execution_data_write: ${execution_data_write}
                process_date_init: ${process_date_init}
                process_date_end: ${process_date_end}
                update_user: ${user}
            result: api_response
          except:
            as: e
            steps:
              - log_registro_fallido:
                  call: sys.log
                  args:
                    text: ${"[MONITORING] No se pudo actualizar el registro de ejecución - " + json.encode_to_string(e)}
                    severity: WARNING
              - return_error:
                  return: null

      - return_response:
          return: ${api_response.body}

  # MONITORING — nunca debe romper el pipeline ni tapar el error original: atrapa su propio
  # error y loguea WARNING. Es especialmente crítico
  # aquí porque este sub-workflow se invoca también desde el except principal (update_process_failed)
  # — si la API de metadata falla justo ahí, no debe perderse el error real que causó la falla.
  UpdateProcessStatus:
    params:
      - api_url
      - process_code
      - execution_date
      - status
      - user
      - flag_active
      - flag_reprocess
      - flag_scheduler
    steps:
      - call_api:
          try:
            call: http.put
            args:
              url: ${api_url + "/api/v1/pipeline-management/pipelines/" + process_code + "/update"}
              auth:
                type: OIDC
                audience: ${api_url}
              body:
                execution_date: ${execution_date}
                flag_active: ${flag_active}
                flag_reprocess: ${flag_reprocess}
                last_status_code: ${status}
                execution_user: ${user}
                update_user: ${user}
                flag_scheduler: ${flag_scheduler}
            result: api_response
          except:
            as: e
            steps:
              - log_registro_fallido:
                  call: sys.log
                  args:
                    text: ${"[MONITORING] No se pudo actualizar el estado del proceso - " + json.encode_to_string(e)}
                    severity: WARNING
              - return_error:
                  return: null

      - return_response:
          return: ${api_response.body}

  BigQueryJobState:
    params: [job_id, project_id]
    steps:
      - Sleep:
          call: sys.sleep
          args:
            seconds: 30

      - JobInfo:
          call: googleapis.bigquery.v2.jobs.get
          args:
            jobId: ${job_id}
            projectId: ${project_id}
          result: jobGetResponse

      - CheckRunning:
          switch:
            - condition: ${jobGetResponse.status.state == "RUNNING"}
              next: Sleep
            - condition: ${jobGetResponse.status.state == "DONE"}
              next: CheckDone

      - CheckDone:
          switch:
            - condition: ${"errorResult" in jobGetResponse.status}
              raise: ${jobGetResponse}
            - condition: ${true}
              next: Return

      - Return:
          return: ${jobGetResponse}
